# Every push and pull request: lint, types, the full test suite against a real
# Postgres (row-level security included), and both production builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skincrm
          POSTGRES_PASSWORD: skincrm_dev_password
          POSTGRES_DB: skincrm
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U skincrm" --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      # Test-only values, same as .env.example. Nothing here is a real secret.
      DATABASE_URL: postgresql://skincrm:skincrm_dev_password@localhost:5433/skincrm
      DATABASE_APP_URL: postgresql://skincrm_app:skincrm_app_dev_password@localhost:5433/skincrm
      DATABASE_APP_PASSWORD: skincrm_app_dev_password
      SESSION_SECRET: dev_only_session_secret_change_me_0000000000
      CRYPTO_MASTER_KEY: dev_only_master_key_change_me_000000000000
      REDIS_URL: redis://localhost:6380
      CONNECTOR_EMAIL: mock
      CONNECTOR_WHATSAPP: mock
      CONNECTOR_META: mock
      OUTBOUND_SENDING_ENABLED: "false"
      WORKER_IN_API: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @skincrm/api build
      - run: pnpm --filter @skincrm/web build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production images
        run: |
          docker build -f deploy/Dockerfile --target api -t skincrm-api .
          docker build -f deploy/Dockerfile --target web -t skincrm-web .
